# Respaldo para mantener despiertos los dos microservicios de Render mientras el software se usa. Render apaga
# un servicio gratuito después de 15 minutos sin tráfico, y la primera petición siguiente tarda cerca de un
# minuto en despertarlo. Lo que los mantiene despiertos son dos trabajos de cron-job.org, que les piden su
# estado de salud cada 5 minutos, de 6:00 a. m. a 10:55 p. m., hora de Colombia: GitHub no garantiza la hora
# de los flujos programados, que retrasa o descarta cuando tiene alta carga. Este flujo hace lo mismo cuando
# GitHub lo ejecuta y, sobre todo, se corre a mano: Actions > Mantener despiertos los servicios > Run workflow.
# GitHub no cobra los minutos de Actions en los repositorios públicos, y corre los flujos programados solo
# desde la rama principal del repositorio, develop.
#
# @author Oscar Iván Blanco Díaz

name: Mantener despiertos los servicios

on:
  schedule:
    # Hora de Colombia (UTC-5, sin cambio de horario): de 6:02 a. m. a 10:57 p. m., en los minutos 2, 7, 12... 57
    # —lejos de la hora en punto, cuando GitHub está más cargado—, que en UTC son las 11:02 a 3:57.
    - cron: '2-57/5 0-3,11-23 * * *'
  workflow_dispatch:

permissions: {}   # no lee ni escribe el repositorio

jobs:
  despertar:
    name: Pedir el estado de salud
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # cada petición espera hasta 90 s, lo que tarda un servicio dormido en despertar, y se repite tres veces si falla
      - name: MS-01 · Identidad y Perfil Académico
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://geprac-academico.onrender.com/api/actuator/health
      - name: MS-02 · Legalización de Prácticas
        if: ${{ !cancelled() }}
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://geprac-legalizacion.onrender.com/api/actuator/health
